# The merge-time checks. docs/process.md §7 numbers these; the step names in
# `verify` carry those numbers so a red run maps onto the written process.
# There is no check 3 — the single-change rule was dropped on 2026-08-31 and
# the numbers below keep the gap, because renumbering would silently move what
# every other document means by "check 4". ADR 1008.
#
# Checks 2, 4, 5, 6 and 9 are bespoke scripts in scripts/. They are the most likely
# part of this system to rot; docs/retrospective.md section 3 scores whether each
# one has earned its keep, and is the place to record it when one stops doing so.
#
# The PR opens as a draft at Stage 4, before a line of `src/` exists, so that
# G4 and G7 are both read as a diff. A draft therefore asserts the opposite of
# what checks 4, 5, 8 and 9 test — they ask whether the Story is finished — and
# those four are skipped while it is one. They run in full the moment the
# janitor takes it out of draft at Stage 8, which is why `ready_for_review` is
# in the trigger list: it is not one of the default pull_request types, and
# without it the first full run would be whatever push happened to follow.
#
# Three jobs. `verify` runs the whole numbered check list on Linux — including
# check 4, which reads Swift test names out of source text and so needs no Swift
# toolchain. `swift` runs the product's own tests and compiles the app shell.
# `ui-smoke` launches the app on a simulator and asks whether it drew.
#
# The first split is by language, because the repository holds two doing
# unrelated jobs (ADR 1001). The second is by cost: `ui-smoke` pays a cold
# simulator boot of about two minutes that nothing can make cheaper, and on
# 2026-09-07 it was measured that a `macos-26` runner has no spare capacity to
# absorb that boot alongside anything else. So it gets a runner of its own rather
# than making `swift test` wait behind it or, worse, run beside it. ADR 1029.
#
# **All three are the `main` ruleset's required checks, by name** — `ui-smoke`
# was added to that list on 2026-09-07, the same day the job was split out, so a
# red smoke test blocks a merge. Nothing in this file makes that true and nothing
# in it would notice the setting being changed back, which is the shape ADR 0013
# is about: this comment is a report of a repository setting, not the gate.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # `docs/graph.mmd` is pushed straight to main by the graph workflow. That
    # push goes over a deploy key rather than GITHUB_TOKEN, and a deploy-key
    # push does trigger workflows — so without this the generated graph would
    # buy a full run, macOS Swift job included, every time an issue closed.
    # A commit touching only that file has nothing below to verify.
    paths-ignore: ['docs/graph.mmd']

permissions:
  contents: read
  # check 5 reads the Story issue's comments to confirm the G4 approval is recorded
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bespoke checks diff against the merge-base with main, so the
          # full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Corepack rather than pnpm/action-setup@v6. That action's self-installer
      # `rm -rf`s its own dest and then runs `npm ci` to fetch the pnpm version
      # baked into the action — 11.19.0 — before self-updating to the 11.22.0
      # this repo pins, so it paid for two downloads on every run and cached
      # neither. On 2026-09-03 the npm half of that started stalling: the step
      # went from 4-6s to 5-7m and stayed there, with npm reporting `added 1
      # package in 7m` while pnpm's own fetch of a *different* pnpm tarball, one
      # second later on the same runner, took under a second. So the tarball
      # path was healthy and npm's metadata round-trips were not, and there was
      # no way to cache around it — hence no npm here at all.
      #
      # Corepack reads `packageManager` from package.json, which means the
      # version stays pinned in exactly one place and the 11.19.0 detour is gone.
      # The prompt variable matters because corepack asks before downloading a
      # version it has not seen; a non-TTY run answers no and fails.
      - name: pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack enable pnpm && corepack install

      # `setup-node`'s own `cache: pnpm` did this until now, but it needs pnpm
      # on PATH when it runs, which is the ordering corepack just took away.
      # Same cache, written out: ask pnpm where its store is rather than guess,
      # since the default moves with PNPM_HOME.
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 1 · openspec validate --all --strict
        run: pnpm run spec:validate

      - name: 2 · spec-diff containment
        run: pnpm run check:specs

      - name: 4 · scenario coverage
        if: github.event.pull_request.draft != true
        run: pnpm run check:scenarios

      - name: 5 · G4 approval recorded
        if: github.event.pull_request.draft != true
        run: pnpm run check:g4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 6 · commit hygiene
        run: pnpm run check:hygiene

      - name: 7 · lint, typecheck, test
        run: pnpm run verify

      - name: 8 · openspec validate --archived
        if: github.event.pull_request.draft != true
        run: pnpm run spec:validate:archived

      - name: 9 · archived before merge
        if: github.event.pull_request.draft != true
        run: pnpm run check:archived

  # Standard GitHub-hosted runners, macOS included, are free and unlimited on
  # public repositories, which ADR 0007 is the reason this repo is. Larger
  # runners are billed even here, so this stays on a standard one.
  #
  # **This job is the Swift code, and it is deliberately short.** Everything that
  # needs a simulator moved to `ui-smoke` below on 2026-09-07, because a boot is
  # about two minutes that nothing can make cheaper and there is no reason for
  # `swift test` to wait behind it. It runs about 90 seconds.
  swift:
    name: swift
    runs-on: macos-26
    steps:
      # No `fetch-depth: 0` here any more. The question that needed history — does
      # this diff reach the app — went to `ui-smoke` with the step that asks it.
      - uses: actions/checkout@v7

      - name: toolchain
        run: swift --version

      # Discovers packages rather than hard-coding a path: it predates the first
      # Swift Story (ADR 1001 was the decision, not the code) and stays discovery-
      # based so a second package needs no CI change.
      #
      # A green run that tested nothing would be worse than a red one, so this
      # says out loud which case it took. macOS runners default to bash 3.2, so
      # no mapfile and no arrays.
      - name: swift test
        run: |
          set -eu
          find . -name Package.swift \
            -not -path '*/.build/*' \
            -not -path '*/node_modules/*' \
            | sort > "$RUNNER_TEMP/swift-packages"
          if [ ! -s "$RUNNER_TEMP/swift-packages" ]; then
            echo "No Package.swift in the tree — no Swift tests to run yet."
            exit 0
          fi
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            echo "::group::swift test — $dir"
            ( cd "$dir" && swift test )
            echo "::endgroup::"
          done < "$RUNNER_TEMP/swift-packages"

      # The app target is invisible to the step above: it adds no `Package.swift`,
      # so `find` returns only the kit's manifest and nothing has ever compiled
      # `src/DayByDay/` in CI. A misspelled binding, a renamed kit symbol, a body
      # that no longer type-checks — all of it could land on `main` green.
      #
      # ADR-1019 left this out and named the exact command that would add it,
      # on the ground that a compile-only step "proves nothing about drawing".
      # That is true, and it is not the comparison: the alternative here is not a
      # UI test, it is nothing at all. The ADR also named its own trigger — add
      # it "the first time the shell holds anything the kit does not" — and the
      # shell now holds four such things, two of which `docs/open-questions.md`
      # already records. So the trigger has fired.
      #
      # `docs/open-questions.md` § *No UI smoke layer* is NOT closed by this. That
      # gap is about proving SwiftUI draws, which needs XCUITest; this step only
      # proves the shell still compiles.
      #
      # No runtime download and no signing identity. ADR-1019 verified that the
      # `macos-26` image ships the iOS 26.2, 26.4 and 26.5 simulator runtimes, so
      # `generic/platform=iOS Simulator` resolves without one, and the project
      # carries `CODE_SIGNING_ALLOWED = NO`.
      #
      # **`build` against the generic destination, and the narrowings of
      # 2026-09-07 are given back.** For one day this was a `build-for-testing`
      # against the concrete simulator, shared with the test step so the sources
      # were not compiled twice — which cost the check its second architecture and
      # its non-testability build, both written down at the time as deliberate.
      # Splitting `ui-smoke` off buys them back for nothing: the duplicate compile
      # is now on a different runner at the same wall-clock moment, so what it
      # costs is 43-48s of a job that is no longer anybody's critical path.
      #
      # **Unconditional, unlike everything in `ui-smoke`.** This is the only step
      # that compiles the shell on a diff the smoke test's gate does not watch —
      # `src/DayByDayKit/Package.swift`, say, which can break the app build while
      # matching none of the three watched paths.
      #
      # Hard-coded rather than discovery-based, unlike `swift test` above: a
      # scheme name cannot be derived from a `find`, and a second `.xcodeproj`
      # here would be an event worth editing this file for.
      - name: xcodebuild — the app shell compiles
        run: |
          set -eu
          xcodebuild \
            -project src/DayByDay/DayByDay.xcodeproj \
            -scheme DayByDay \
            -destination 'generic/platform=iOS Simulator' \
            build

  # The UI smoke layer: proof that SwiftUI drew something. The `swift` job proves
  # the shell compiles and the kit's rules hold; between them sits the failure
  # neither can see — a binding misspelled so a subtree never renders, which
  # type-checks, passes all 300 seam tests, and ships a blank row.
  # `docs/open-questions.md` § *No UI smoke layer* recorded that gap from
  # 2026-08-31; ADR-1029 is the decision that closed it, and `DayByDayUITests` is
  # deliberately thin.
  #
  # **Its own job since 2026-09-07, and the reason is a measurement rather than
  # tidiness.** A runner's simulators have never been booted since the image was
  # built, so this pays a cold boot of 115-135s that nothing here can avoid — the
  # image leaves no device booted, which was checked. Inside the `swift` job that
  # boot was serial with `swift test`, and overlapping the two was tried and
  # disproved: `swift test` went to 436s, 245s and 384s against a 34-76s baseline
  # while the smoke step fell by about as much, because a `macos-26` runner has no
  # spare capacity to absorb a boot. A second runner has its own capacity, which
  # is the one way to overlap them honestly. ADR-1029 carries the numbers.
  #
  # **It is one of the `main` ruleset's required checks, added there on
  # 2026-09-07.** So a red smoke test blocks a merge — but that is a repository
  # setting rather than anything this file can assert, and if it is ever removed
  # from that list this job will go on running and go on being ignored. Exactly
  # the shape ADR-0013 warns about: do not read this comment as the guarantee.
  ui-smoke:
    name: ui-smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope step below asks whether this change reaches the app at all,
          # which is a question about a diff — so it needs history, exactly as the
          # bespoke checks in `verify` do.
          fetch-depth: 0

      # **Why the smoke test is gated twice.** It is skipped while a PR is a draft
      # — the idiom checks 4, 5, 8 and 9 already use — and skipped again unless the
      # diff reaches the shell, the kit's sources or this file. Over this
      # repository's first 129 commits, 8 touched `src/DayByDay/`. Neither gate
      # weakens the merge: a Story PR leaves draft at Stage 8 and a chore PR is
      # never a draft, so the step runs before anything is merged and again on the
      # push to `main`.
      #
      # **The gates matter more than ADR-1029 thought, not less.** It costed the
      # smoke test at 3m45s; on 2026-09-07 it was 5m10s and 8m36s, and taking the
      # clone out left a cold simulator boot that is minutes on its own and cannot
      # be got rid of. This is the only question in the job that can decline to
      # pay it — and now that the job is its own, declining costs nothing at all.
      - name: does this change reach the app?
        id: scope
        run: |
          set -eu
          # Listed literally rather than held in a variable: `-- $watched` relies
          # on the shell splitting one string into three pathspecs, which bash
          # does and zsh does not, so it works here and silently matches nothing
          # when anyone tests it from a Mac terminal. Caught doing exactly that.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
            # A first push to a branch, or a force-push, reports a `before` that
            # is not in the tree. Nothing to diff against, so do not guess: run.
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "No usable base to diff against — running the smoke test."
              echo "reached=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          changed=$(git diff --name-only "$base" HEAD -- \
            src/DayByDay/ \
            src/DayByDayKit/Sources/ \
            .github/workflows/ci.yml)

          if [ -n "$changed" ]; then
            echo "Reaches the app:"
            echo "$changed" | sed 's/^/  /'
            echo "reached=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Reaches neither the shell, the kit's sources, nor this workflow."
            echo "reached=no" >> "$GITHUB_OUTPUT"
          fi

      # **The device is discovered, not named.** A hard-coded `name=iPhone 17` is a
      # bet on the runner image's device list, which moves with Xcode and is not
      # ours to pin. The runtimes shipped on `macos-26` create devices at image
      # build time, so this asks `simctl` which iPhone is actually there and says
      # which one it took — a green run against a device nobody can identify is
      # the failure mode being avoided.
      #
      # **An already-booted iPhone wins, if there is one — and on 2026-09-07 there
      # was not.** The boot below is the largest thing in this job at 114-135s
      # across four runs, and it is only owed on a cold device, so it was worth
      # asking whether the image leaves one up. It does not: `simctl list devices
      # booted` on `macos-26` prints the iOS 26.2, 26.4, 26.5 and tvOS 26.2
      # runtime headers and no device rows at all. The preference is kept anyway
      # because it costs a couple of seconds, falls back to exactly the previous
      # choice, and would take the saving if an image ever changed — and the probe
      # is kept with it so the answer stays on the record instead of becoming a
      # claim in a comment. Ordering is otherwise unchanged: newest runtime first,
      # first iPhone in it.
      - name: which simulator?
        id: sim
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: |
          set -eu
          echo "Already booted on this runner:"
          xcrun simctl list devices booted | sed 's/^/  /'
          device=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; ps=[d for rt in sorted(ds, reverse=True) for d in ds[rt] if d['name'].startswith('iPhone')]; b=[d for d in ps if d['state']=='Booted']; print((b or ps)[0]['udid'])")
          echo "Building against and testing on simulator ${device}."
          echo "device=$device" >> "$GITHUB_OUTPUT"

      # **The boot gets its own step, because it is the single largest thing in
      # this job and it should say so.** Folded into the test step it read as "the
      # UI test is slow", which is what ADR-1029 originally recorded and what sent
      # the first attempt at this chore chasing the wrong thing.
      #
      # **It runs before the build rather than after it**, which is worth a
      # sentence because it looks like the wrong order. `bootstatus -b` blocks, so
      # nothing overlaps and no step's number is borrowed from another; what the
      # build buys is 30-50 seconds of the device *settling* before anything is
      # installed on it. That is not a guess — the runs where the device had been
      # up for minutes finished the test step in 106-139s, and the runs where it
      # had just this second reported `Finished` took 189-262s.
      #
      # `bootstatus -b` boots the device as well as waiting for it, and is
      # documented as safe to call before any boot has been attempted — so this
      # one command is the whole thing, and it is where a simulator that will not
      # come up gets reported.
      - name: boot the simulator
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b

      # `build-for-testing` rather than `build`: this is the app *and* the UI test
      # bundle, against the device the test will run on, so the step after it is
      # the test and nothing else. The `swift` job's compile step is the one that
      # answers "does the shell compile" for the diffs this job's gate declines.
      #
      # Coverage and the index store are off because nothing reads either. The
      # scheme `xcodebuild` derives turns coverage on, so the kit was being
      # compiled `-profile-generate -profile-coverage-mapping` for no reader.
      - name: xcodebuild build-for-testing
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: |
          set -eu
          xcodebuild build-for-testing \
            -project src/DayByDay/DayByDay.xcodeproj \
            -scheme DayByDay \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:DayByDayUITests \
            -enableCodeCoverage NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      # **`-parallel-testing-enabled NO`.** The derived scheme parallelises by
      # default and there is no `.xcscheme` in the tree to say otherwise, so
      # `xcodebuild test` was cloning the device and running on
      # `Clone 1 of iPhone 17 Pro`. One test on one device buys nothing from a
      # clone. Measured locally on 2026-09-07, cold simulator and warm build:
      # 47.7s cloned against 28.3s not. On the runner the test operation fell from
      # 284.6s and 492.4s to 76.1s, 96.5s and 112.6s.
      #
      # **`test-without-building`**, because the step above already built it,
      # against this same device.
      - name: xcodebuild test — the app shell draws
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: |
          set -eu
          xcodebuild test-without-building \
            -project src/DayByDay/DayByDay.xcodeproj \
            -scheme DayByDay \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:DayByDayUITests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO
