# The merge-time checks. docs/process.md §7 numbers these 1..6; the step names
# in `verify` carry those numbers so a red run maps onto the written process.
#
# Checks 2-6 are bespoke scripts in scripts/. They are the most likely part of
# this system to rot; docs/retrospective.md section 3 scores whether each one has
# earned its keep, and is the place to record it when one stops doing so.
#
# The PR opens as a draft at Stage 4, before a line of `src/` exists, so that
# G4 and G7 are both read as a diff. A draft therefore asserts the opposite of
# what checks 3, 4, 5 and 8 test — they ask whether the Story is finished — and
# those four are skipped while it is one. They run in full the moment the
# janitor takes it out of draft at Stage 8, which is why `ready_for_review` is
# in the trigger list: it is not one of the default pull_request types, and
# without it the first full run would be whatever push happened to follow.
#
# Two jobs, because the repository holds two languages doing unrelated jobs
# (ADR 1001). `verify` runs the whole numbered check list on Linux — including
# check 4, which reads Swift test names out of source text and so needs no
# Swift toolchain. `swift` exists only to run the product's own tests, and is
# the one thing here that needs macOS.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  # check 5 reads the Story issue's comments to confirm the G4 approval is recorded
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bespoke checks diff against the merge-base with main, so the
          # full history has to be present.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 1 · openspec validate --all --strict
        run: pnpm run spec:validate

      - name: 2 · spec-diff containment
        run: pnpm run check:specs

      - name: 3 · single-change rule
        if: github.event.pull_request.draft != true
        run: pnpm run check:change

      - name: 4 · scenario coverage
        if: github.event.pull_request.draft != true
        run: pnpm run check:scenarios

      - name: 5 · G4 approval recorded
        if: github.event.pull_request.draft != true
        run: pnpm run check:g4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 6 · commit hygiene
        run: pnpm run check:hygiene

      - name: 7 · lint, typecheck, test
        run: pnpm run verify

      - name: 8 · openspec validate --archived
        if: github.event.pull_request.draft != true
        run: pnpm run spec:validate:archived

  # Standard GitHub-hosted runners, macOS included, are free and unlimited on
  # public repositories, which ADR 0007 is the reason this repo is. Larger
  # runners are billed even here, so this stays on a standard one.
  swift:
    name: swift
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: swift --version

      # No Swift exists yet — ADR 1001 is the decision, not the first Story. The
      # job is here so the Story that writes the first test does not also have to
      # touch CI plumbing. It discovers packages rather than hard-coding a path,
      # because the package layout is not decided yet either.
      #
      # A green run that tested nothing would be worse than a red one, so this
      # says out loud which case it took. macOS runners default to bash 3.2, so
      # no mapfile and no arrays.
      - name: swift test
        run: |
          set -eu
          find . -name Package.swift \
            -not -path '*/.build/*' \
            -not -path '*/node_modules/*' \
            | sort > "$RUNNER_TEMP/swift-packages"
          if [ ! -s "$RUNNER_TEMP/swift-packages" ]; then
            echo "No Package.swift in the tree — no Swift tests to run yet."
            exit 0
          fi
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            echo "::group::swift test — $dir"
            ( cd "$dir" && swift test )
            echo "::endgroup::"
          done < "$RUNNER_TEMP/swift-packages"
