# The merge-time checks. docs/process.md §7 numbers these; the step names in
# `verify` carry those numbers so a red run maps onto the written process.
# There is no check 3 — the single-change rule was dropped on 2026-08-31 and
# the numbers below keep the gap, because renumbering would silently move what
# every other document means by "check 4". ADR 1008.
#
# Checks 2, 4, 5, 6 and 9 are bespoke scripts in scripts/. They are the most likely
# part of this system to rot; docs/retrospective.md section 3 scores whether each
# one has earned its keep, and is the place to record it when one stops doing so.
#
# The PR opens as a draft at Stage 4, before a line of `src/` exists, so that
# G4 and G7 are both read as a diff. A draft therefore asserts the opposite of
# what checks 4, 5, 8 and 9 test — they ask whether the Story is finished — and
# those four are skipped while it is one. They run in full the moment the
# janitor takes it out of draft at Stage 8, which is why `ready_for_review` is
# in the trigger list: it is not one of the default pull_request types, and
# without it the first full run would be whatever push happened to follow.
#
# Two jobs, because the repository holds two languages doing unrelated jobs
# (ADR 1001). `verify` runs the whole numbered check list on Linux — including
# check 4, which reads Swift test names out of source text and so needs no
# Swift toolchain. `swift` runs the product's own tests and then compiles the
# app shell, and is the one thing here that needs macOS.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # `docs/graph.mmd` is pushed straight to main by the graph workflow. That
    # push goes over a deploy key rather than GITHUB_TOKEN, and a deploy-key
    # push does trigger workflows — so without this the generated graph would
    # buy a full run, macOS Swift job included, every time an issue closed.
    # A commit touching only that file has nothing below to verify.
    paths-ignore: ['docs/graph.mmd']

permissions:
  contents: read
  # check 5 reads the Story issue's comments to confirm the G4 approval is recorded
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bespoke checks diff against the merge-base with main, so the
          # full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Corepack rather than pnpm/action-setup@v6. That action's self-installer
      # `rm -rf`s its own dest and then runs `npm ci` to fetch the pnpm version
      # baked into the action — 11.19.0 — before self-updating to the 11.22.0
      # this repo pins, so it paid for two downloads on every run and cached
      # neither. On 2026-09-03 the npm half of that started stalling: the step
      # went from 4-6s to 5-7m and stayed there, with npm reporting `added 1
      # package in 7m` while pnpm's own fetch of a *different* pnpm tarball, one
      # second later on the same runner, took under a second. So the tarball
      # path was healthy and npm's metadata round-trips were not, and there was
      # no way to cache around it — hence no npm here at all.
      #
      # Corepack reads `packageManager` from package.json, which means the
      # version stays pinned in exactly one place and the 11.19.0 detour is gone.
      # The prompt variable matters because corepack asks before downloading a
      # version it has not seen; a non-TTY run answers no and fails.
      - name: pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack enable pnpm && corepack install

      # `setup-node`'s own `cache: pnpm` did this until now, but it needs pnpm
      # on PATH when it runs, which is the ordering corepack just took away.
      # Same cache, written out: ask pnpm where its store is rather than guess,
      # since the default moves with PNPM_HOME.
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: 1 · openspec validate --all --strict
        run: pnpm run spec:validate

      - name: 2 · spec-diff containment
        run: pnpm run check:specs

      - name: 4 · scenario coverage
        if: github.event.pull_request.draft != true
        run: pnpm run check:scenarios

      - name: 5 · G4 approval recorded
        if: github.event.pull_request.draft != true
        run: pnpm run check:g4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 6 · commit hygiene
        run: pnpm run check:hygiene

      - name: 7 · lint, typecheck, test
        run: pnpm run verify

      - name: 8 · openspec validate --archived
        if: github.event.pull_request.draft != true
        run: pnpm run spec:validate:archived

      - name: 9 · archived before merge
        if: github.event.pull_request.draft != true
        run: pnpm run check:archived

  # Standard GitHub-hosted runners, macOS included, are free and unlimited on
  # public repositories, which ADR 0007 is the reason this repo is. Larger
  # runners are billed even here, so this stays on a standard one.
  swift:
    name: swift
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The UI smoke step below asks whether this change reaches the app at
          # all, which is a question about a diff — so it needs history, exactly
          # as the bespoke checks in `verify` do.
          fetch-depth: 0

      - name: toolchain
        run: swift --version

      # **Why the smoke test is gated twice, when the two steps before it are
      # not.** It is skipped while a PR is a draft — the idiom checks 4, 5, 8 and
      # 9 already use — and skipped again unless the diff reaches the shell, the
      # kit's sources or this file. Over this repository's first 129 commits, 8
      # touched `src/DayByDay/`, and a Story pushes tens of times while it is a
      # draft, so paid unconditionally it would be waste on nearly every push.
      # Neither gate weakens the merge: a Story PR leaves draft at Stage 8 and a
      # chore PR is never a draft, so the step runs before anything is merged and
      # again on the push to `main`.
      #
      # The arithmetic behind that is much smaller than it was. ADR-1029 costed
      # this step at 3m45s; by 2026-09-07 it was 5m10s and 8m36s on two
      # consecutive runs, and the rebuild below took it to about a minute. At
      # that price the second gate is thrift rather than necessity — kept
      # because it costs one `git diff` and still saves a boot.
      #
      # **Asked here, at the top, rather than beside the step it gates.** The
      # answer is what decides whether the simulator is worth booting, and a boot
      # started after the build has nothing left to overlap. It needs only the
      # checkout.
      - name: does this change reach the app?
        id: scope
        run: |
          set -eu
          # Listed literally rather than held in a variable: `-- $watched` relies
          # on the shell splitting one string into three pathspecs, which bash
          # does and zsh does not, so it works here and silently matches nothing
          # when anyone tests it from a Mac terminal. Caught doing exactly that.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
            # A first push to a branch, or a force-push, reports a `before` that
            # is not in the tree. Nothing to diff against, so do not guess: run.
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "No usable base to diff against — running the smoke test."
              echo "reached=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          changed=$(git diff --name-only "$base" HEAD -- \
            src/DayByDay/ \
            src/DayByDayKit/Sources/ \
            .github/workflows/ci.yml)

          if [ -n "$changed" ]; then
            echo "Reaches the app:"
            echo "$changed" | sed 's/^/  /'
            echo "reached=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Reaches neither the shell, the kit's sources, nor this workflow."
            echo "reached=no" >> "$GITHUB_OUTPUT"
          fi

      # **The device is discovered, not named.** A hard-coded `name=iPhone 17` is a bet on
      # the runner image's device list, which moves with Xcode and is not ours to pin. The
      # runtimes shipped on `macos-26` create devices at image build time, so this asks
      # `simctl` which iPhone is actually there and says which one it took — a green run
      # against a device nobody can identify is the failure mode being avoided.
      #
      # Unconditional, because the build below needs a concrete destination whether or
      # not anything runs on it. Naming a device does not boot one.
      - name: which simulator?
        id: sim
        run: |
          set -eu
          device=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for rt in sorted(ds, reverse=True) for d in ds[rt] if d['name'].startswith('iPhone')))")
          echo "Building against, and if it runs, testing on simulator ${device}."
          echo "device=$device" >> "$GITHUB_OUTPUT"

      # **This is the step that made the smoke test affordable**, and it is three
      # words of shell. A runner's simulator devices have never been booted since
      # the image was built, so the first boot is a cold one and it is minutes,
      # not seconds — and until 2026-09-07 every second of it was spent *after*
      # the build, with the runner otherwise idle. Started here it runs underneath
      # `swift test` and the build, and `bootstatus -b` at the bottom is the join.
      #
      # `simctl boot` returns in about half a second and the boot proceeds inside
      # `CoreSimulatorService`, a launchd job — so it is not a child of this step's
      # shell and the runner's orphan-process cleanup between steps does not touch
      # it. Verified across separate shells on 2026-09-07. A backgrounded `&` here
      # would be killed; this is why the step is a plain foreground command.
      #
      # `|| true` because `boot` errors on a device that is already booted, and
      # because a boot that fails outright is not this step's to report: the
      # `bootstatus -b` below boots the device itself if this did not, so the
      # failure surfaces where it can be read.
      - name: start booting it
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: xcrun simctl boot "${{ steps.sim.outputs.device }}" || true

      # Discovers packages rather than hard-coding a path: it predates the first
      # Swift Story (ADR 1001 was the decision, not the code) and stays discovery-
      # based so a second package needs no CI change.
      #
      # A green run that tested nothing would be worse than a red one, so this
      # says out loud which case it took. macOS runners default to bash 3.2, so
      # no mapfile and no arrays.
      - name: swift test
        run: |
          set -eu
          find . -name Package.swift \
            -not -path '*/.build/*' \
            -not -path '*/node_modules/*' \
            | sort > "$RUNNER_TEMP/swift-packages"
          if [ ! -s "$RUNNER_TEMP/swift-packages" ]; then
            echo "No Package.swift in the tree — no Swift tests to run yet."
            exit 0
          fi
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            echo "::group::swift test — $dir"
            ( cd "$dir" && swift test )
            echo "::endgroup::"
          done < "$RUNNER_TEMP/swift-packages"

      # The app target is invisible to the step above: it adds no `Package.swift`,
      # so `find` returns only the kit's manifest and nothing has ever compiled
      # `src/DayByDay/` in CI. A misspelled binding, a renamed kit symbol, a body
      # that no longer type-checks — all of it could land on `main` green.
      #
      # ADR-1019 left this out and named the exact command that would add it,
      # on the ground that a compile-only step "proves nothing about drawing".
      # That is true, and it is not the comparison: the alternative here is not a
      # UI test, it is nothing at all. The ADR also named its own trigger — add
      # it "the first time the shell holds anything the kit does not" — and the
      # shell now holds four such things, two of which `docs/open-questions.md`
      # already records. So the trigger has fired.
      #
      # `docs/open-questions.md` § *No UI smoke layer* is NOT closed by this. That
      # gap is about proving SwiftUI draws, which needs XCUITest and a change to
      # CI check 4; this step only proves the shell still compiles.
      #
      # No runtime download and no signing identity. ADR-1019 verified that the
      # `macos-26` image ships the iOS 26.2, 26.4 and 26.5 simulator runtimes, and
      # the project carries `CODE_SIGNING_ALLOWED = NO`.
      #
      # **`build-for-testing`, not `build`, and against the concrete simulator —
      # which is two deliberate narrowings, measured 2026-09-07.** It was
      # `-destination 'generic/platform=iOS Simulator' build`, which builds a
      # universal `x86_64 arm64` binary (confirmed with `lipo -archs`) and cost
      # 43-48s on the runner; the test step then compiled the same sources again
      # for the device it was about to run on. One `build-for-testing` against
      # that device does both jobs — and leaves DerivedData warm, so the step
      # below is the test and nothing else. The narrowings: the shell is now
      # compiled for arm64 only, and compiled with testability enabled. For pure
      # Swift against one SDK neither changes what "does the shell still compile
      # against the kit" can catch, and the runners are arm64.
      #
      # Coverage and the index store are off because nothing reads either. The
      # scheme `xcodebuild` derives turns coverage on, so the kit was being
      # compiled `-profile-generate -profile-coverage-mapping` for no reader.
      #
      # Hard-coded rather than discovery-based, unlike `swift test` above: a
      # scheme name cannot be derived from a `find`, and a second `.xcodeproj`
      # here would be an event worth editing this file for.
      - name: xcodebuild — the app shell compiles
        run: |
          set -eu
          xcodebuild build-for-testing \
            -project src/DayByDay/DayByDay.xcodeproj \
            -scheme DayByDay \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:DayByDayUITests \
            -enableCodeCoverage NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      # The UI smoke layer: proof that SwiftUI drew something. The step above proves the
      # shell compiles, and `swift test` proves the kit's rules; between them sits the
      # failure neither can see — a binding misspelled so a subtree never renders, which
      # type-checks, passes all 300 seam tests, and ships a blank row.
      # `docs/open-questions.md` § *No UI smoke layer* recorded that gap from 2026-08-31;
      # ADR-1029 is the decision that closed it, and `DayByDayUITests` is deliberately thin.
      #
      # **`bootstatus -b` is the join and the gate.** It waits for the boot started
      # near the top of this job, boots the device itself if that never happened,
      # and is documented as safe to call before a boot has been attempted — so it
      # is the one place a simulator that will not come up gets reported.
      #
      # **`-parallel-testing-enabled NO`, which is where the minutes went.** The
      # derived scheme parallelises by default and there is no `.xcscheme` in the
      # tree to say otherwise, so `xcodebuild test` was cloning the device and
      # running on `Clone 1 of iPhone 17 Pro` — a second cold first boot stacked on
      # the source device's own. One test on one device buys nothing from a clone.
      # Measured here on 2026-09-07, cold simulator, warm build: 47.7s cloned
      # against 28.3s not, and 17.0s not-cloned-and-already-booted. On the runner
      # the same shape cost 260-450s (runs 34120659274 and 34116245290), of which
      # the test itself was 25-40s.
      #
      # **`test-without-building`**, because the step above already built it. The
      # two halves are split so the boot has something to overlap; run as one
      # `xcodebuild test` there is nothing between the build and the simulator.
      - name: xcodebuild test — the app shell draws
        if: github.event.pull_request.draft != true && steps.scope.outputs.reached == 'yes'
        run: |
          set -eu
          xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b
          xcodebuild test-without-building \
            -project src/DayByDay/DayByDay.xcodeproj \
            -scheme DayByDay \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:DayByDayUITests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO
